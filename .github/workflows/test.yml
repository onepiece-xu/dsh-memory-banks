name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # `npm install` (not ci) because the lockfile is generated on Windows.
      - run: npm install --no-audit --no-fund
      # `npm test` builds dist/ first, then runs the pure-logic and
      # real-module integration tests.
      - run: npm test
